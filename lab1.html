<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цветовые модели: CMYK · RGB · HLS</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: #f4f5f7;
  color: #1d2129;
  font: 15px/1.4 system-ui, sans-serif;
}
h1 { font-size: 20px; margin: 0 0 12px; }
.top { display: flex; gap: 16px; margin-bottom: 16px; }
#prev {
  flex: 1 1 260px;
  min-height: 120px;
  display: flex;
  align-items: flex-end;
  padding: 10px;
  border: 1px solid #d9dde3;
  border-radius: 12px;
  font-weight: 600;
}
#prev span {
  padding: 2px 8px;
  border-radius: 6px;
  background: rgba(0,0,0,.55);
  color: #fff;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 16px;
}
.card {
  padding: 14px;
  background: #fff;
  border: 1px solid #d9dde3;
  border-radius: 12px;
}
.card h2 { font-size: 16px; margin: 0 0 2px; }
.card small { color: #667085; }
.row {
  display: grid;
  grid-template-columns: 22px 1fr 76px;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.row b { font-size: 14px; }
input[type=number], input[type=text] {
  width: 100%;
  padding: 5px 6px;
  border: 1px solid #d9dde3;
  border-radius: 6px;
  font: inherit;
}
input[type=range] { width: 100%; }
.pal {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed #d9dde3;
}
.pal p { margin: 0 0 6px; color: #667085; font-size: 13px; }
.sw { display: flex; flex-wrap: wrap; gap: 6px; }
.sw button {
  width: 30px;
  height: 30px;
  padding: 0;
  border: 1px solid #d9dde3;
  border-radius: 6px;
  cursor: pointer;
}
input[type=color] {
  width: 100%;
  height: 40px;
  padding: 2px;
  border: 1px solid #d9dde3;
  border-radius: 8px;
}
#cv {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  cursor: crosshair;
  touch-action: none;
}
#cv canvas { display: block; width: 100%; height: 150px; }
#mk {
  position: absolute;
  width: 14px;
  height: 14px;
  margin: -7px 0 0 -7px;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 1px #000;
  pointer-events: none;
}
</style>
</head>

<body>
<h1>Цветовые модели: RGB · CMYK · HLS</h1>

<div class="top">
  <div id="prev"><span id="hexl"></span></div>
  <div class="card" style="flex: 1 1 200px">
    <h2>HEX</h2>
    <small>Ввод #RRGGBB</small>
    <div style="margin-top: 8px">
      <input type="text" id="hex" maxlength="7">
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const S = { r: 255, g: 0, b: 0, c: 0, m: 100, y: 100, k: 0, h: 0, l: 50, s: 100 };

function rgb2cmyk(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const k = 1 - Math.max(r, g, b);
  if (k >= 1) return { c: 0, m: 0, y: 0, k: 100 };
  return {
    c: (1 - r - k) / (1 - k) * 100,
    m: (1 - g - k) / (1 - k) * 100,
    y: (1 - b - k) / (1 - k) * 100,
    k: k * 100
  };
}

function cmyk2rgb(c, m, y, k) {
  c /= 100; m /= 100; y /= 100; k /= 100;
  return {
    r: 255 * (1 - c) * (1 - k),
    g: 255 * (1 - m) * (1 - k),
    b: 255 * (1 - y) * (1 - k)
  };
}

function rgb2hls(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b);
  const mn = Math.min(r, g, b);
  const d = mx - mn;
  const l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (d > 1e-9) {
    s = d / (1 - Math.abs(2 * l - 1));
    if (mx === r) h = 60 * (((g - b) / d + 6) % 6);
    else if (mx === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
  }
  return { h, l: l * 100, s: s * 100 };
}

function hls2rgb(h, l, s) {
  l /= 100; s /= 100;
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  return { r: (r + m) * 255, g: (g + m) * 255, b: (b + m) * 255 };
}

function keepHls(o) {
  if (o.s < 1e-6 || o.l < 1e-6 || o.l > 100 - 1e-6) o.h = S.h;
  if (o.l < 1e-6 || o.l > 100 - 1e-6) o.s = S.s;
  return o;
}

function setRGB(r, g, b) {
  Object.assign(S, { r: clamp(r, 0, 255), g: clamp(g, 0, 255), b: clamp(b, 0, 255) });
  Object.assign(S, rgb2cmyk(S.r, S.g, S.b));
  Object.assign(S, keepHls(rgb2hls(S.r, S.g, S.b)));
}

function setCMYK(c, m, y, k) {
  Object.assign(S, { c: clamp(c, 0, 100), m: clamp(m, 0, 100), y: clamp(y, 0, 100), k: clamp(k, 0, 100) });
  Object.assign(S, cmyk2rgb(S.c, S.m, S.y, S.k));
  Object.assign(S, keepHls(rgb2hls(S.r, S.g, S.b)));
}

function setHLS(h, l, s) {
  Object.assign(S, { h: clamp(h, 0, 360), l: clamp(l, 0, 100), s: clamp(s, 0, 100) });
  Object.assign(S, hls2rgb(S.h, S.l, S.s));
  Object.assign(S, rgb2cmyk(S.r, S.g, S.b));
}

const hex = () =>
  '#' + [S.r, S.g, S.b]
    .map(v => Math.round(v).toString(16).padStart(2, '0'))
    .join('')
    .toUpperCase();

const MODELS = [
  { id: 'rgb', name: 'RGB', sub: 'Красный, зелёный, синий (0–255)',
    set: a => setRGB(...a),
    f: [['r', 'R', 255], ['g', 'G', 255], ['b', 'B', 255]] },
  { id: 'cmyk', name: 'CMYK', sub: 'Голубой, пурпурный, жёлтый, чёрный (%)',
    set: a => setCMYK(...a),
    f: [['c', 'C', 100], ['m', 'M', 100], ['y', 'Y', 100], ['k', 'K', 100]] },
  { id: 'hls', name: 'HLS', sub: 'Оттенок (°), светлота (%), насыщенность (%)',
    set: a => setHLS(...a),
    f: [['h', 'H', 360], ['l', 'L', 100], ['s', 'S', 100]] }
];

const grid = $('#grid');

MODELS.forEach(M => {
  const card = document.createElement('div');
  card.className = 'card';
  const rows = M.f.map(([k, label, max]) => {
    const step = max === 255 ? 1 : 0.1;
    return `
      <div class="row">
        <b>${label}</b>
        <input type="range" id="${k}r" min="0" max="${max}" step="${step}">
        <input type="number" id="${k}n" min="0" max="${max}" step="${step}">
      </div>`;
  }).join('');
  card.innerHTML = `
    <h2>${M.name}</h2>
    <small>${M.sub}</small>
    ${rows}
    <div class="pal" id="pal-${M.id}"></div>`;
  grid.appendChild(card);

  const current = () => M.f.map(([k]) => S[k]);

  M.f.forEach(([k], i) => {
    const onChange = e => {
      const v = parseFloat(e.target.value);
      if (isNaN(v)) return;
      const values = current();
      values[i] = v;
      M.set(values);
      render(e.target);
    };
    $('#' + k + 'r').addEventListener('input', onChange);
    $('#' + k + 'n').addEventListener('input', onChange);
    $('#' + k + 'n').addEventListener('blur', () => render());
  });
});

$('#pal-rgb').innerHTML = '<p>Палитра: системный выбор цвета</p><input type="color" id="cp">';

$('#cp').addEventListener('input', e => {
  const v = e.target.value;
  setRGB(
    parseInt(v.slice(1, 3), 16),
    parseInt(v.slice(3, 5), 16),
    parseInt(v.slice(5, 7), 16)
  );
  render(e.target);
});

const SWATCHES = [
  [100, 0, 0, 0], [0, 100, 0, 0], [0, 0, 100, 0], [0, 0, 0, 100],
  [100, 100, 0, 0], [0, 100, 100, 0], [100, 0, 100, 0], [0, 0, 0, 50],
  [50, 0, 0, 0], [0, 50, 0, 0], [0, 0, 50, 0], [0, 0, 0, 0],
  [100, 100, 100, 0], [20, 40, 60, 10], [60, 20, 80, 20], [0, 70, 90, 5]
];

$('#pal-cmyk').innerHTML = '<p>Палитра: образцы CMYK</p><div class="sw" id="sw"></div>';

SWATCHES.forEach(a => {
  const btn = document.createElement('button');
  const c = cmyk2rgb(...a);
  btn.style.background = `rgb(${c.r}, ${c.g}, ${c.b})`;
  btn.title = `C${a[0]} M${a[1]} Y${a[2]} K${a[3]}`;
  btn.onclick = () => { setCMYK(...a); render(); };
  $('#sw').appendChild(btn);
});

$('#pal-hls').innerHTML = `
  <p>Палитра: оттенок (→) × светлота (↓), при текущей S</p>
  <div id="cv"><canvas width="360" height="150"></canvas><div id="mk"></div></div>`;

const cv = $('#cv canvas');
const ctx = cv.getContext('2d');

function drawPalette() {
  const img = ctx.createImageData(360, 150);
  for (let y = 0; y < 150; y++) {
    for (let x = 0; x < 360; x++) {
      const c = hls2rgb(x, 100 - y / 149 * 100, S.s);
      const i = (y * 360 + x) * 4;
      img.data[i] = c.r;
      img.data[i + 1] = c.g;
      img.data[i + 2] = c.b;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function pickFromPalette(e) {
  const r = cv.getBoundingClientRect();
  const x = clamp((e.clientX - r.left) / r.width, 0, 1);
  const y = clamp((e.clientY - r.top) / r.height, 0, 1);
  setHLS(x * 360, 100 - y * 100, S.s);
  render(cv);
}

let dragging = false;
const box = $('#cv');

box.addEventListener('pointerdown', e => {
  dragging = true;
  box.setPointerCapture(e.pointerId);
  pickFromPalette(e);
});
box.addEventListener('pointermove', e => { if (dragging) pickFromPalette(e); });
box.addEventListener('pointerup', () => { dragging = false; });

$('#hex').addEventListener('input', e => {
  const v = e.target.value.trim();
  if (!/^#?[0-9a-fA-F]{6}$/.test(v)) return;
  const h = v.replace('#', '');
  setRGB(
    parseInt(h.slice(0, 2), 16),
    parseInt(h.slice(2, 4), 16),
    parseInt(h.slice(4, 6), 16)
  );
  render(e.target);
});

let lastSat = -1;

function render(src) {
  const fmt = (k, v) =>
    (k === 'r' || k === 'g' || k === 'b')
      ? String(Math.round(v))
      : String(Math.round(v * 10) / 10);

  MODELS.forEach(M => M.f.forEach(([k]) => {
    const num = $('#' + k + 'n');
    const rng = $('#' + k + 'r');
    if (document.activeElement !== num || src !== num) num.value = fmt(k, S[k]);
    if (src !== rng) rng.value = S[k];
  }));

  const hx = hex();
  $('#prev').style.background = hx;
  $('#hexl').textContent = hx;
  if (src !== $('#hex')) $('#hex').value = hx;
  if (src !== $('#cp')) $('#cp').value = hx.toLowerCase();

  if (Math.round(S.s) !== lastSat) {
    lastSat = Math.round(S.s);
    drawPalette();
  }

  const mk = $('#mk');
  mk.style.left = S.h / 360 * 100 + '%';
  mk.style.top = (100 - S.l) + '%';
}

setRGB(70, 130, 200);
render();
</script>
</body>
</html>
